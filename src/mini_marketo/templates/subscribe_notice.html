<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p>{{ body }}</p>
    {% if action %}
    <form method="post" action="{{ action }}">
      <button>{{ button }}</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
